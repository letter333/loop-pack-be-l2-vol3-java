server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      pgPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.bulkhead.BulkheadFullException
      pgQuery:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      pgPayment:
        max-concurrent-calls: 20
        max-wait-duration: 0ms
      pgQuery:
        max-concurrent-calls: 10
        max-wait-duration: 0ms
  retry:
    retry-aspect-order: 2
    instances:
      pgQuery:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

queue:
  admission:
    batch-size: 10
    interval-ms: 1000
  token:
    ttl-minutes: 5

---
spring:
  config:
    activate:
      on-profile: local, test

pg:
  base-url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/callback
  connect-timeout: 1000
  read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      pgPayment:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        wait-duration-in-open-state: 1s
      pgQuery:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        wait-duration-in-open-state: 1s
  bulkhead:
    instances:
      pgPayment:
        max-concurrent-calls: 2
      pgQuery:
        max-concurrent-calls: 2
  retry:
    instances:
      pgQuery:
        max-attempts: 2
        wait-duration: 100ms

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false